name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Build mod
        run: |
          mkdir tpl upd
          unzip -q "$(ls *template*.zip | head -1)" -d tpl
          unzip -q "$(ls *update*.zip | head -1)" -d upd
          T="$(dirname "$(find tpl -name gradlew | head -1)")"
          rm -rf "$T/src"
          cp -r upd/src "$T/src"
          echo 'tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }' >> "$T/build.gradle"
          cd "$T"
          chmod +x gradlew
          echo "=== MAPPINGS ==="
          grep -nE "mappings|Mojang" build.gradle || true
          ./gradlew build --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1 || { echo "=== ОШИБКИ ==="; grep -A2 "error:" "$GITHUB_WORKSPACE/build.log" | head -70; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: learnclient-jar
          path: out/*.jar
