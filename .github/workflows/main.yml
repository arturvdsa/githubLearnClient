name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Build mod
        run: |
          UPD="$(find . -maxdepth 1 -name '*update*.zip' | head -1)"
          if [ -z "$UPD" ]; then
            echo "ОШИБКА: в корне репозитория нет learnclient-1.7-update.zip"
            ls -la
            exit 1
          fi
          mkdir -p upd
          unzip -q "$UPD" -d upd
          rm -rf src
          cp -r upd/src src
          echo 'tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }' >> build.gradle
          chmod +x gradlew
          ./gradlew build --console=plain > build.log 2>&1 || { echo "=== ОШИБКИ ==="; grep -A2 "error:" build.log | head -70; exit 1; }
          mkdir -p out
          cp build/libs/*.jar out/

      - uses: actions/upload-artifact@v4
        with:
          name: learnclient-jar
          path: out/*.jar
